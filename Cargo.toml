[workspace]
resolver = "2"
members = ["crates/type84-proto", "crates/type84-hid", "crates/type84-cli", "crates/type84-gui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Arteminariy/keyboard-hub"
homepage = "https://github.com/Arteminariy/keyboard-hub"
authors = ["Arteminariy"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
hex = "0.4"
